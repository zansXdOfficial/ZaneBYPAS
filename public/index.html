<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AM Preset Finder</title>
<style>
  :root {
    --bg: #0f0b1a; --card: #1a1428; --line: #2a2240; --text: #eae6f5; --muted: #9a93b3;
    --accent: #3ef2c0; --accent-ink: #062b22;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(1200px 500px at 50% -100px, #241a42, var(--bg)); color: var(--text);
         font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; min-height: 100vh; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 60px; }
  header { text-align: center; margin-bottom: 28px; }
  header h1 { margin: 8px 0 4px; font-size: 22px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  h2 { font-size: 26px; margin: 8px 0 8px; display: flex; align-items: center; gap: 12px; }
  h2::before { content: ""; width: 56px; height: 3px; background: var(--accent); border-radius: 2px; }
  .lead { color: var(--muted); line-height: 1.55; font-size: 15px; margin: 0 0 18px; }
  form { display: flex; gap: 10px; }
  .field { flex: 1; display: flex; align-items: center; background: var(--card); border: 1px solid var(--line);
           border-radius: 12px; padding: 0 12px; min-width: 0; }
  .field input { flex: 1; background: none; border: 0; outline: 0; color: var(--text); font-size: 15px; padding: 14px 8px; min-width: 0; }
  .field button { background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; }
  .go { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 0 22px;
        font-weight: 700; font-size: 16px; cursor: pointer; }
  .go:disabled { opacity: .6; cursor: wait; }
  .recent { display: flex; gap: 8px; overflow-x: auto; margin: 12px 0 0; padding-bottom: 4px; }
  .chip { white-space: nowrap; background: var(--card); border: 1px solid var(--line); color: var(--muted);
          border-radius: 20px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 18px; }
  .video { display: flex; gap: 12px; }
  .video img { width: 84px; height: 112px; object-fit: cover; border-radius: 10px; background: #000; }
  .desc { color: var(--muted); font-size: 14px; line-height: 1.45; word-break: break-word; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; font-size: 12px; color: var(--muted); letter-spacing: .08em; }
  .stats b { display: block; color: var(--text); font-size: 17px; letter-spacing: 0; margin-top: 2px; }
  .steps { list-style: none; padding: 0; margin: 0; }
  .steps li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .steps li:last-child { border: 0; }
  .ok { color: var(--accent); } .skip { color: var(--muted); }
  .count { background: #12303a; color: var(--accent); border: 1px solid #1f5a52; border-radius: 8px; padding: 2px 10px; font-size: 14px; }
  .preset { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 12px; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .badge { background: #12303a; border: 1px solid #1f5a52; color: var(--accent); border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 700; }
  .badge.src { background: #231b38; border-color: var(--line); color: var(--muted); font-weight: 500; }
  .url { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; color: var(--muted); word-break: break-all; margin: 6px 0 12px; }
  .actions { display: flex; gap: 10px; }
  .btn { border-radius: 10px; padding: 10px 16px; font-weight: 700; font-size: 14px; text-decoration: none; border: 0; cursor: pointer; }
  .btn.p { background: var(--accent); color: var(--accent-ink); }
  .btn.s { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 500; }
  .note { color: #f2c46e; font-size: 13px; margin: 10px 0 0; line-height: 1.45; }
  .err { color: #ff8a8a; margin-top: 16px; font-size: 14px; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent);
          border-radius: 50%; animation: s .8s linear infinite; vertical-align: -2px; margin-right: 8px; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <header>
    <h1>AM Preset Finder</h1>
    <p>Cari preset Alight Motion dari link TikTok mana pun</p>
  </header>

  <h2>Cari link preset</h2>
  <p class="lead">Tempel link video TikTok. Deskripsi, bio akun, bio link, komentar, dan balasan dibuka satu per satu lalu dipindai untuk link preset Alight Motion.</p>

  <form id="f">
    <div class="field">
      <span>🔍</span>
      <input id="u" type="url" inputmode="url" placeholder="https://vt.tiktok.com/..." autocomplete="off" required>
      <button type="button" id="x" aria-label="Hapus">✕</button>
    </div>
    <button class="go" id="go">Search</button>
  </form>
  <div class="recent" id="recent"></div>

  <div id="out"></div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const u = $('#u'), out = $('#out'), go = $('#go');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n) => n >= 1e6 ? (n/1e6).toFixed(1)+' M' : n >= 1e3 ? (n/1e3).toFixed(1)+' K' : String(n);

// riwayat link (disimpan di browser, kalau tersedia)
function recents() { try { return JSON.parse(localStorage.getItem('recent') || '[]'); } catch { return []; } }
function saveRecent(url) {
  try { localStorage.setItem('recent', JSON.stringify([url, ...recents().filter((x) => x !== url)].slice(0, 8))); } catch {}
  drawRecent();
}
function drawRecent() {
  $('#recent').innerHTML = recents().map((r) => `<button type="button" class="chip" data-u="${esc(r)}">${esc(r)}</button>`).join('');
}
$('#recent').addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (b) { u.value = b.dataset.u; run(); } });
$('#x').onclick = () => { u.value = ''; out.innerHTML = ''; u.focus(); };
$('#f').onsubmit = (e) => { e.preventDefault(); run(); };
drawRecent();

async function run() {
  const url = u.value.trim();
  if (!url) return;
  go.disabled = true;
  out.innerHTML = '<div class="box"><span class="spin"></span>Membuka deskripsi, bio, komentar, dan balasan…</div>';
  try {
    const r = await fetch('/api/scan', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ url }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Gagal');
    saveRecent(url);
    render(d);
  } catch (e) {
    out.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  } finally { go.disabled = false; }
}

function render(d) {
  const v = d.video;
  const steps = d.sources.map((s) => `<li><span>${esc(s.name)}${s.scanned != null ? ` <span class="skip">(${s.scanned} discan)</span>` : ''}</span>
    <span class="${s.checked ? 'ok' : 'skip'}">${s.checked ? s.found + ' link' : 'dilewati'}</span></li>`).join('');
  const cards = d.links.map((l, i) => `
    <div class="preset">
      <div class="badges"><span class="badge">${esc(l.badge)}</span>${l.sources.map((s) => `<span class="badge src">${esc(s)}</span>`).join('')}</div>
      <div class="url">${esc(l.url)}</div>
      <div class="actions">
        <a class="btn p" href="${esc(l.href)}" target="_blank" rel="noopener noreferrer">${esc(l.action)}</a>
        <button class="btn s" data-copy="${i}">Copy link</button>
      </div>
    </div>`).join('');

  out.innerHTML = `
    <div class="box">
      <div class="video">
        ${v.cover ? `<img src="${esc(v.cover)}" alt="" referrerpolicy="no-referrer">` : ''}
        <div class="desc">${esc(v.desc) || '<i>Tanpa deskripsi</i>'}</div>
      </div>
      <div class="stats">
        <div>ACCOUNT<b>@${esc(v.author)}</b></div><div>COMMENTS<b>${fmt(v.comments)}</b></div>
        <div>VIEWS<b>${fmt(v.views)}</b></div><div>LIKES<b>${fmt(v.likes)}</b></div>
      </div>
    </div>
    <div class="box"><ul class="steps">${steps}</ul></div>
    ${d.notes.map((n) => `<p class="note">⚠ ${esc(n)}</p>`).join('')}
    <h2 style="font-size:20px;margin-top:26px">Preset links <span class="count">${d.links.length}</span></h2>
    ${cards || '<p class="lead">Tidak ada link preset ditemukan di video ini.</p>'}`;

  out.querySelectorAll('[data-copy]').forEach((b) => b.onclick = async () => {
    try { await navigator.clipboard.writeText(d.links[b.dataset.copy].url); b.textContent = 'Tersalin ✓'; }
    catch { b.textContent = 'Gagal salin'; }
    setTimeout(() => b.textContent = 'Copy link', 1500);
  });
}
</script>
</body>
</html>
